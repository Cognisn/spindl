name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # Hash-locked environments for the oldest supported mcp 1.x and the
        # first 2.x release; regenerate with scripts/lock-ci.sh.
        mcp-lock: ["mcp1", "mcp2"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --require-hashes --only-binary :all: -r requirements/ci-${{ matrix.mcp-lock }}.txt

      - name: Run tests
        run: pytest --cov=spindl --cov-report=xml -v --timeout=60

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && matrix.mcp-lock == 'mcp1'
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage.xml

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --require-hashes --only-binary :all: -r requirements/ci-mcp2.txt

      - name: Check formatting (black)
        run: black --check src/ tests/

      - name: Check imports (isort)
        run: isort --check-only src/ tests/

      - name: Type checking (mypy)
        run: mypy src/spindl
