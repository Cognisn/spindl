name: Feature Request
description: Suggest a new feature or enhancement
labels: [enhancement]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please describe what you'd like.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? What's the use case?
      placeholder: I'm trying to ... but currently I have to ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you think this should work? Include API examples if possible.
      placeholder: |
        server = MCPServer(prefix="myapp", ...)
        server.register(MyCustomTool())
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Spindl does this relate to?
      options:
        - MCPServer
        - BaseTool
        - Response Spooler
        - Query Engine
        - Prefix Resolver
        - Tool Registry
        - Skills Guide
        - Transports (stdio/HTTP/SSE)
        - New Component
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches you've considered.

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant information.
